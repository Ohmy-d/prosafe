<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transferring</title>

<style>
body{
    margin:0;
    background:black;
    color: #aaaaaa;
    font-family:monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}
.box{
    width:90%;
}
.bar{
    margin-top:20px;
    height:10px;
    background:#002b22;
    border-radius:10px;
    overflow:hidden;
}
.progress{
    height:100%;
    width:0%;
    background:#898989;
    box-shadow:0 0 10px #00ff9c;
}
</style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#rgba(0, 0, 0, 0)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vault">
  <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>

<div class="box">
    <div id="text">Routing random lockers...</div>

    <div class="bar">
        <div class="progress" id="progress"></div>
    </div>
</div>

<script>
const progress = document.getElementById("progress");

let percent = 0;

const timer = setInterval(()=>{
    percent += Math.random()*15;
    progress.style.width = percent + "%";

    if(percent >= 100){
        clearInterval(timer);
        setTimeout(()=>{
            
        },200);
    }
},100);
</script>
<script>
  const links = ["vault.html"];

  setTimeout(() => {
    const randomIndex = Math.floor(Math.random() * links.length);
    window.location.href = links[randomIndex];
  }, 1100); 
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("./sw.js")
      .then(r=>console.log("SW registered",r.scope))
      .catch(e=>console.warn("SW failed",e));
  });
}
</script>
<!-- PWA Install Banner -->
<div id="pwa-banner" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9999;
  padding:14px 18px;background:rgba(14,14,14,0.97);backdrop-filter:blur(20px);
  border-top:1px solid rgba(0,229,160,.3);
  display:none;align-items:center;gap:12px;font-family:'DM Sans',sans-serif;">
  <img src="favicon.ico" style="width:40px;height:40px;border-radius:10px;flex-shrink:0">
  <div style="flex:1">
    <div style="font-size:14px;font-weight:600;color:#f0f0f0">Install ProSafe</div>
    <div style="font-size:12px;color:#888">Add to home screen for offline use</div>
  </div>
  <button id="pwa-install-btn" style="padding:9px 18px;border-radius:50px;border:none;
    background:#00e5a0;color:#000;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">
    Install
  </button>
  <button id="pwa-dismiss" style="background:none;border:none;color:#888;font-size:20px;
    cursor:pointer;padding:4px 8px;line-height:1">×</button>
</div>
<script>
let _deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  _deferredPrompt = e;
  const b = document.getElementById('pwa-banner');
  if(b) b.style.display='flex';
});
document.addEventListener('DOMContentLoaded', ()=>{
  const btn = document.getElementById('pwa-install-btn');
  const dis = document.getElementById('pwa-dismiss');
  const ban = document.getElementById('pwa-banner');
  if(btn) btn.addEventListener('click', async()=>{
    if(!_deferredPrompt) return;
    _deferredPrompt.prompt();
    const {outcome} = await _deferredPrompt.userChoice;
    _deferredPrompt = null;
    if(ban) ban.style.display='none';
  });
  if(dis) dis.addEventListener('click', ()=>{ if(ban) ban.style.display='none'; });
});
window.addEventListener('appinstalled', ()=>{
  const b = document.getElementById('pwa-banner');
  if(b) b.style.display='none';
  _deferredPrompt=null;
});
</script>
</body>
</html>

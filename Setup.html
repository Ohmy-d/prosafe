<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Safe</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    color:white;
    font-family:Arial;
}
.box{
    text-align:center;
}
input{
    width:60px;
    font-size:22px;
    text-align:center;
    margin:5px;
}
button{
    margin-top:10px;
    padding:10px 20px;
}
</style>
</head>
<body>

<div class="box">
    <h2>Create 3 Numbers</h2>
    <input type="number" id="n1" min="0" max="99">
    <input type="number" id="n2" min="0" max="99">
    <input type="number" id="n3" min="0" max="99">
    <br>
    <button onclick="save()">SAVE</button>
</div>

<script>
function save(){
    const code = [
        Number(n1.value),
        Number(n2.value),
        Number(n3.value)
    ];

    localStorage.setItem("safe_code", JSON.stringify(code));
    window.location.href = "index.html";
}
</script>

</body>
</html>
